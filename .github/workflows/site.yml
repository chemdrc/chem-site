# Compile le site avec Eleventy, vérifie les liens, puis publie sur GitHub Pages (branche main uniquement).
# Prérequis (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Site CHEM

on:
  push:
    branches: [main, modernisation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Compiler le site (Eleventy)
        run: npx @11ty/eleventy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les liens internes et les pages FR/EN
        run: |
          pip install --quiet beautifulsoup4 html5lib
          python scripts/verifier-site.py _site
      - name: Préparer la publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
